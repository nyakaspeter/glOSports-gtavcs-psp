; VCSNative default configuration.
; Uses asynchronous GE execution, the cross-unit AOT hot-register cache, native
; indexed/strip submission, packed 0x0115 GPU decode, hardware culling and batch
; merging.
[Display]
Enabled=true
; Output resolution mode: PSP | Desktop | Custom
;   PSP     = 480x272 logical output
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses Width and Height below
ResolutionMode=PSP
; Used by ResolutionMode=Custom. Valid ranges: Width 320-16384, Height 180-16384.
Width=1920
Height=1080
; Fullscreen=true uses a borderless desktop-sized window. In that mode Width/Height
; still define the Custom logical output size, but the window itself fills the desktop.
Fullscreen=true
AspectRatio=Preserve
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=true

[Rendering]
Backend=DirectX12
; Do not enable: this path renders buildings incorrectly, transparent cars and
; wrong textures on fences. It stays off until those rendering bugs are fixed.
HardwareTransform=true ; goodluckOS: transform on the GPU (the GLES 2 vertex shader decodes the packed PSP vertices)
DX12GEColor=true
TextureCacheEntries=2048
TextureCacheMB=48 ; goodluckOS: 512 MB of RAM
; Internal render resolution mode: PSP | Scale | Desktop | Custom
;   PSP     = native 480x272 rendering
;   Scale   = 480x272 multiplied by InternalScale (1-8)
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses InternalWidth and InternalHeight below
InternalResolutionMode=Custom ; goodluckOS: 480x360, as the LCS port (4:3 at 3/4 of the screen)
; Used only by InternalResolutionMode=Scale.
InternalScale=2
; Used only by InternalResolutionMode=Custom.
; Valid ranges: InternalWidth 480-16384, InternalHeight 272-16384.
InternalWidth=480
InternalHeight=360
MSAA=1
; A real, working single-pass FXAA implementation (not true SMAA -- see the
; comment in vcs_config.hpp). Kept under the historical SMAA key for
; backward .ini compatibility.
SMAA=false
; Unsharp-mask sharpening of the final frame -- helps PSP-era low-res
; textures read as crisper after being magnified by the internal-resolution
; upscale. 0.0 = off. Real detail sharpening (not reconstruction of missing
; detail); 0.3-0.6 is a reasonable range before halos/ringing get visible.
Sharpen=0.0
AnisotropicFiltering=1
DepthPrecision=16
ExperimentalGpuColorPreview=false
GeometryDebugColors=false
DumpGpuFrameVblank=0

; Locked to 60 -- this build targets and is tuned for a flawless 60fps
; baseline. Any other value is rejected and falls back to 60.
[Timing]
FrameRate=60 ; goodluckOS: the game does not wait for vblanks itself; VCS_FPS_CAP=30 in start.sh caps its frames at 30
RealtimeSpeedDiagnostics=false
RealtimeSpeedIntervalVblanks=240

[Audio]
Enabled=true
Volume=100
Diagnostics=false
PrebufferBlocks=8
RecoveryPrebufferBlocks=14

[Widescreen]
Enabled=true
AspectRatio=4:3 ; goodluckOS: 4:3 view, fills the 640x480 screen; the HUD is squeezed vertically

[Project2DFX]
Enabled=false
PerformanceLog=false

; Experimental single-pass bloom. Only implemented in the Vulkan GE backend
; right now: works on macOS (Vulkan/MoltenVK is the only backend there) and
; on Windows only if built with -DPSPRECOMP_VCS_WIN32_VULKAN=ON. A default
; Windows build uses DirectX 12, which has no bloom pass yet -- this setting
; is silently a no-op there, not a bug.
; Threshold: luminance (0-1) above which a pixel starts glowing.
; Intensity: how strongly the glow is added back over the scene.
[SimulateHDR]
Enabled=false
Threshold=0.80
Intensity=0.60

[DrawDistance]
Enabled=false
World=3.00
; Vehicles and NPCs are always 1.00 (game default): scaling them makes fewer spawn.
Vehicles=1.00
NPCs=1.00
; Distance at which a vehicle/pedestrian switches from its low-poly to
; high-poly model -- a purely visual effect, unlike Vehicles/NPCs above
; (which also affect population spawn density), so this can go much higher
; safely. Fixes the "low-poly blob snapping to a full model a few meters
; away" pop-in.
LOD=3.00

; Optional "Vice neon" colour grade, off by default; all-1.0/0.0 values would
; be a no-op, so the numbers below are the preset. Saturation 1.15-1.30 is the
; range before it reads as cartoonish, with a slight warm-red / neutral-green /
; mild-blue tint. This is one static grade, not the game's own time-of-day
; colour interpolation, so warm daytime and cool night cannot be shifted
; separately.
[ColorGrading]
Enabled=false
Saturation=1.18
Contrast=1.05
Brightness=0.00
TintR=1.05
TintG=0.98
TintB=1.02

[Controls]
CameraStick=true
MouseSensitivity=50
InvertCameraY=false
; How far the on-foot camera may tilt upwards, 10 to 85 degrees. The game's own limit is 45; this stops
; short of it on purpose, so values above 45 behave like 45. 40 lets you look well up at buildings and sky.
PedCameraUpLimitDegrees=40
ModernControlScheme=false
; Show keyboard and mouse names in the game's prompts instead of PSP buttons.
KeyboardPrompts=true

[Diagnostics]
LogToFile=false ; goodluckOS: start.sh logs to /dev/shm
LogFile=VCSNative.log
FlushEveryLine=false

; Texture replacement and upscaling. Replacement PNGs go in the Directory (beside
; the game, or an absolute path) named <hash>.png and must be exactly 2x/4x/8x the
; game's texture. Turn DumpOriginals on once to write every texture the game uses
; to <Directory>/originals so a pack can be built from them.
[Textures]
; Full mip chain for every texture: stable, sharp distant surfaces.
Mipmaps=false ; goodluckOS: no generated mip chains
Replacement=false
; Procedural sub-texel grit where a texture is stretched far past its resolution (walls, ground).
Detail=false
Directory=Textures
DumpOriginals=false
; Conservative built-in upscaler for textures that have no replacement. Off until
; it passes the fidelity checks on the full texture set.
Upscale=false
; Auto = 4x for textures up to 64 px, 2x up to 256 px; or force 2, 4 or 8.
UpscaleScale=Auto
UpscaleSharpen=0.25
